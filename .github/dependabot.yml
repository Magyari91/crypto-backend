version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Budapest
    open-pull-requests-limit: 3
    groups:
      backend-actions:
        patterns:
          - "*"

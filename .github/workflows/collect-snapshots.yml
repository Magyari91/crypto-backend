name: Snapshot Collector

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: forecast-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect due Sites forecasts
        shell: bash
        env:
          SITES_URL: https://cryptovision-forecast.mattila.chatgpt.site
          SNAPSHOT_TOKEN: ${{ secrets.SITES_SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SNAPSHOT_TOKEN" ]; then
            echo "The SITES_SNAPSHOT_TOKEN repository secret is not configured."
            exit 1
          fi

          response="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $SNAPSHOT_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SITES_URL}/api/v1/internal/snapshots/collect")"

          jq -e '
            .generated_at
            and ((.created | type) == "number")
            and ((.evaluated | type) == "number")
            and ((.processed | type) == "array")
          ' <<<"$response" > /dev/null

          errors="$(jq '[.processed[] | select(.error != null)] | length' <<<"$response")"
          {
            echo "### Sites forecast collector"
            echo ""
            echo "- Created: $(jq -r '.created' <<<"$response")"
            echo "- Evaluated: $(jq -r '.evaluated' <<<"$response")"
            echo "- Processed: $(jq -r '.processed | length' <<<"$response")"
            echo "- Errors: $errors"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$errors" -eq 0

      - name: Verify production services
        shell: bash
        env:
          SITES_URL: https://cryptovision-forecast.mattila.chatgpt.site
        run: |
          set -euo pipefail

          curl_flags=(
            --silent
            --show-error
            --fail-with-body
            --retry 2
            --retry-delay 10
            --retry-all-errors
            --connect-timeout 20
            --max-time 120
          )

          data_health="$(curl "${curl_flags[@]}" \
            "${SITES_URL}/api/v1/forecast/data-health")"
          test "$(jq -r '.storage.backend' <<<"$data_health")" = "cloudflare_d1"
          test "$(jq -r '.storage.persistent' <<<"$data_health")" = "true"
          test "$(jq -r '.collector.automatic' <<<"$data_health")" = "true"
          test "$(jq -r '.totals.snapshot_count' <<<"$data_health")" -gt 0

          dashboard="$(curl "${curl_flags[@]}" \
            "${SITES_URL}/api/v1/dashboard?coin=bitcoin&horizon=7")"
          jq -e '
            .selected.current_price > 0
            and .selected.forecast.target_price > 0
            and .selected.forecast.prediction_interval.lower_price > 0
            and .selected.forecast.prediction_interval.upper_price > 0
          ' <<<"$dashboard" > /dev/null

          markets="$(curl "${curl_flags[@]}" \
            "${SITES_URL}/api/v1/markets?limit=200")"
          test "$(jq -r '.count' <<<"$markets")" -ge 100
          test "$(jq -r '.analysis_limit' <<<"$markets")" -eq 10

          frontend_urls=(
            "${SITES_URL}/"
            "${SITES_URL}/market"
            "${SITES_URL}/forecast/bitcoin"
            "${SITES_URL}/models"
            "${SITES_URL}/news"
          )

          for url in "${frontend_urls[@]}"; do
            curl "${curl_flags[@]}" --output /dev/null "$url"
          done

name: Snapshot Collector

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: forecast-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect scheduled feature snapshot
        env:
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          if [ -z "$SNAPSHOT_TOKEN" ]; then
            echo "The SNAPSHOT_TOKEN repository secret is not configured."
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --request POST \
            --header "X-Snapshot-Token: $SNAPSHOT_TOKEN" \
            "https://crypto-backend-pv99.onrender.com/api/v1/internal/snapshots/collect"

      - name: Verify production services
        shell: bash
        run: |
          set -euo pipefail

          curl_flags=(
            --silent
            --show-error
            --fail-with-body
            --retry 2
            --retry-delay 10
            --retry-all-errors
            --connect-timeout 20
            --max-time 120
          )

          health="$(curl "${curl_flags[@]}" \
            "https://crypto-backend-pv99.onrender.com/health")"
          test "$(jq -r '.status' <<<"$health")" = "ok"
          test "$(jq -r '.storage.backend' <<<"$health")" = "postgresql"
          test "$(jq -r '.storage.persistent' <<<"$health")" = "true"

          data_health="$(curl "${curl_flags[@]}" \
            "https://crypto-backend-pv99.onrender.com/api/v1/forecast/data-health")"
          test "$(jq -r '.collector.status' <<<"$data_health")" = "healthy"
          test "$(jq -r '.storage.persistent' <<<"$data_health")" = "true"
          test "$(jq -r '.totals.snapshot_count' <<<"$data_health")" -gt 0

          registry="$(curl "${curl_flags[@]}" \
            "https://crypto-backend-pv99.onrender.com/api/v1/forecast/registry")"
          test "$(jq -r '.model_version // empty' <<<"$registry")" != ""

          frontend_urls=(
            "https://crypto-frontend-d94v.onrender.com/"
            "https://crypto-frontend-d94v.onrender.com/market/"
            "https://crypto-frontend-d94v.onrender.com/forecast/bitcoin/"
            "https://crypto-frontend-d94v.onrender.com/models/"
            "https://crypto-frontend-d94v.onrender.com/news/"
            "https://crypto-frontend-d94v.onrender.com/robots.txt"
            "https://crypto-frontend-d94v.onrender.com/sitemap.xml"
          )

          for url in "${frontend_urls[@]}"; do
            curl "${curl_flags[@]}" --output /dev/null "$url"
          done

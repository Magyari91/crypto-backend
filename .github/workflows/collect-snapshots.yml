name: Snapshot Collector

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: snapshot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect scheduled feature snapshot
        env:
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          if [ -z "$SNAPSHOT_TOKEN" ]; then
            echo "The SNAPSHOT_TOKEN repository secret is not configured."
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --request POST \
            --header "X-Snapshot-Token: $SNAPSHOT_TOKEN" \
            "https://crypto-backend-pv99.onrender.com/api/v1/internal/snapshots/collect"

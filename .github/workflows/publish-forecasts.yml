name: Forecast Publisher

on:
  workflow_dispatch:
    inputs:
      publication:
        description: Forecast package to publish for an emergency rerun
        type: choice
        required: true
        default: daily
        options:
          - daily
          - weekly
          - monthly
          - all

permissions: {}

concurrency:
  group: forecast-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Select due horizons
        id: plan
        shell: bash
        env:
          MANUAL_PUBLICATION: ${{ inputs.publication }}
        run: |
          set -euo pipefail

          case "$MANUAL_PUBLICATION" in
            daily) horizons="[1]" ;;
            weekly) horizons="[7]" ;;
            monthly) horizons="[30]" ;;
            all) horizons="[1,7,30]" ;;
            *) echo "Unknown publication package: $MANUAL_PUBLICATION"; exit 1 ;;
          esac

          echo "horizons=$horizons" >> "$GITHUB_OUTPUT"
          echo "Publishing horizons: $horizons"

      - name: Publish top ten forecasts
        shell: bash
        env:
          SITES_URL: https://cryptovision-forecast.mattila.chatgpt.site
          HORIZONS: ${{ steps.plan.outputs.horizons }}
          SNAPSHOT_TOKEN: ${{ secrets.SITES_SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$SNAPSHOT_TOKEN" ]]; then
            echo "The SITES_SNAPSHOT_TOKEN repository secret is not configured."
            exit 1
          fi

          response="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 3 \
            --retry-delay 20 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --request POST \
            --header "Authorization: Bearer $SNAPSHOT_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"horizons\":${HORIZONS},\"force\":true}" \
            "${SITES_URL}/api/v1/internal/snapshots/collect")"

          errors="$(jq '[.processed[] | select(.error != null)] | length' <<<"$response")"
          expected="$(( $(jq 'length' <<<"$HORIZONS") * 10 ))"
          test "$(jq '.processed | length' <<<"$response")" -eq "$expected"
          test "$errors" -eq 0

          {
            echo "### Emergency forecast publication"
            echo ""
            echo "- Horizons: $HORIZONS"
            echo "- Created: $(jq -r '.created' <<<"$response")"
            echo "- Evaluated: $(jq -r '.evaluated' <<<"$response")"
            echo "- Processed: $(jq -r '.processed | length' <<<"$response")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify persistent publication storage
        shell: bash
        env:
          SITES_URL: https://cryptovision-forecast.mattila.chatgpt.site
        run: |
          set -euo pipefail

          health="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            "${SITES_URL}/api/v1/forecast/data-health")"

          test "$(jq -r '.storage.backend' <<<"$health")" = "cloudflare_d1"
          test "$(jq -r '.storage.persistent' <<<"$health")" = "true"
          test "$(jq -r '.collector.automatic' <<<"$health")" = "true"
          test "$(jq -r '.totals.snapshot_count' <<<"$health")" -gt 0
